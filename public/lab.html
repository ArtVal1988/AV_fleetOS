<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopRent — вибір мови (тест)</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
html,body{margin:0;height:100%;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7f6;color:#333;}
/* Фонова картинка на весь екран */
#siteBg{position:fixed;inset:0;background:#2b2b2b url('/lab-bg.jpg') no-repeat center top / cover;}
#testTag{position:fixed;left:8px;bottom:8px;z-index:9000;font-size:11px;font-weight:700;color:#92400e;background:#fef3c7;
  border:1px solid #f59e0b;padding:4px 9px;border-radius:12px;cursor:pointer;opacity:.85;}
#testTag:hover{opacity:1}

/* Заставка вибору мови */
.language-splash{position:fixed;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(135deg,rgba(30,60,114,.72) 0%,rgba(42,82,152,.72) 100%);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;
  transition:opacity .5s ease,transform .5s ease;color:#fff;}
.language-splash.hidden{opacity:0;pointer-events:none;transform:scale(1.05);}
.splash-logo{font-size:3rem;margin-bottom:10px;font-weight:bold;letter-spacing:2px;}
.splash-title{font-size:1.4rem;margin-bottom:40px;opacity:.9;text-align:center;max-width:90%;line-height:1.6;}
.lang-buttons{display:flex;gap:25px;flex-wrap:wrap;justify-content:center;}
.lang-btn{display:flex;align-items:center;justify-content:center;gap:15px;min-width:200px;padding:15px 30px;
  font-size:1.2rem;font-weight:600;color:#1e3c72;background:#fff;border:none;border-radius:30px;cursor:pointer;
  box-shadow:0 4px 15px rgba(0,0,0,.2);transition:all .3s ease;}
.flag-icon{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 2px 5px rgba(0,0,0,.15);}
.lang-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.3);background:#f8f9fa;}
.lang-btn:active{transform:translateY(-1px);}
</style>
</head>
<body>

<!-- ФОН (картинка, без посилань) -->
<div id="siteBg" role="img" aria-label="TopRent"></div>
<div id="testTag" title="Показати вибір мови знову">🧪 тест · змінити мову</div>

<!-- ЗАСТАВКА (SPLASH SCREEN) -->
<div id="languageSplash" class="language-splash">
  <div class="splash-logo">ВІТАЄМО</div>
  <div class="splash-title" id="splashTitle">Будь ласка, оберіть мову для відображення сайту</div>
  <div class="lang-buttons">
    <button class="lang-btn" onclick="selectLanguage('uk')">
      <img class="flag-icon" src="https://flagcdn.com/w80/ua.png" alt="Прапор України">
      Українська
    </button>
    <button class="lang-btn" onclick="selectLanguage('en')">
      <img class="flag-icon" src="https://flagcdn.com/w80/gb.png" alt="Flag of the United Kingdom">
      English
    </button>
  </div>
</div>

<script>
  function selectLanguage(lang){
    document.getElementById('languageSplash').classList.add('hidden');
    document.documentElement.lang = lang;
  }

  function showSplash(){
    const s = document.getElementById('languageSplash');
    s.style.display = 'flex';
    requestAnimationFrame(() => s.classList.remove('hidden'));
  }

  document.getElementById('testTag').addEventListener('click', showSplash);
  // Заставка показується при кожному заході на сторінку (вибір не пропускає її наступного разу).
</script>
</body>
</html>
