<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopRent — вибір мови (тест)</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
html,body{margin:0;height:100%;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f7f6;color:#333;}
/* Фонова картинка на весь екран */
#siteBg{position:fixed;inset:0;background:#2b2b2b url('/lab-bg.jpg') no-repeat center top / cover;}
#testTag{position:fixed;left:8px;bottom:8px;z-index:9000;font-size:11px;font-weight:700;color:#92400e;background:#fef3c7;
  border:1px solid #f59e0b;padding:4px 9px;border-radius:12px;cursor:pointer;opacity:.85;}
#testTag:hover{opacity:1}

/* Заставка вибору мови: біла картка по центру, фон розмитий */
.language-splash{position:fixed;inset:0;background:rgba(235,240,248,.35);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;justify-content:center;align-items:center;padding:16px;z-index:9999;
  transition:opacity .45s ease;}
.language-splash.hidden{opacity:0;pointer-events:none;}
.language-splash.hidden .splash-card{transform:scale(.96) translateY(8px);}
.splash-card{width:100%;max-width:750px;background:rgba(255,255,255,.9);border-radius:10px;
  padding:56px 40px 64px;text-align:center;box-shadow:0 20px 60px rgba(30,50,90,.25);
  transition:transform .45s ease;}
.splash-globe{width:136px;height:136px;display:block;margin:0 auto 26px;}
.splash-logo{font-size:2.5rem;font-weight:800;color:#111;margin:0 0 12px;line-height:1.15;}
.splash-title{font-size:1.2rem;color:#5b6270;margin:0 0 34px;line-height:1.5;}
.lang-buttons{display:flex;gap:25px;justify-content:center;flex-wrap:wrap;}
.lang-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  width:232px;height:142px;font:inherit;font-size:1.45rem;font-weight:700;color:#111;
  background:linear-gradient(180deg,#fff 0%,#f1f4f9 100%);border:1px solid #e3e7ee;border-radius:14px;cursor:pointer;
  box-shadow:0 4px 14px rgba(30,50,90,.12);transition:transform .2s ease,box-shadow .2s ease;}
.lang-btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,50,90,.2);}
.lang-btn:active{transform:translateY(-1px);}
.lang-btn:focus-visible{outline:3px solid #2a5298;outline-offset:2px;}
.flag-icon{width:70px;height:47px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.25);}
@media (max-width:560px){
  .splash-card{padding:32px 18px 36px;}
  .splash-globe{width:96px;height:96px;margin-bottom:18px;}
  .splash-logo{font-size:1.7rem;}
  .splash-title{font-size:1rem;margin-bottom:22px;}
  .lang-buttons{gap:12px;}
  .lang-btn{width:calc(50% - 6px);min-width:130px;height:116px;font-size:1.1rem;}
  .flag-icon{width:58px;height:39px;}
}
</style>
</head>
<body>

<!-- ФОН (картинка, без посилань) -->
<div id="siteBg" role="img" aria-label="TopRent"></div>
<div id="testTag" title="Показати вибір мови знову">🧪 тест · змінити мову</div>

<!-- ЗАСТАВКА (SPLASH SCREEN) -->
<div id="languageSplash" class="language-splash" role="dialog" aria-modal="true" aria-label="Вибір мови / Language">
  <div class="splash-card">
    <svg class="splash-globe" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <radialGradient id="gSea" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#cfe6fb"/><stop offset="1" stop-color="#5f93d6"/></radialGradient>
        <radialGradient id="gLand" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7e6f7"/></radialGradient>
        <clipPath id="gClip"><circle cx="60" cy="60" r="56"/></clipPath>
      </defs>
      <circle cx="60" cy="60" r="56" fill="url(#gSea)"/>
      <g clip-path="url(#gClip)" fill="url(#gLand)">
        <path d="M18 34c8-8 22-12 30-8 6 3 2 9 8 12 5 3 3 9-3 11-5 2-4 8-10 10-7 3-6 12-12 12-5 0-6-8-9-14-3-7-9-8-10-14-1-4 0-6 6-9z"/>
        <path d="M66 22c8-4 20-3 28 3 6 5 2 9 9 13 4 3 3 8-3 9-6 1-8 7-14 6-6-1-6-8-11-10-6-2-9-6-7-11 1-4-4-6-2-10z"/>
        <path d="M70 70c7-3 16-1 20 4 4 5 0 12-5 16-5 4-12 6-16 2-5-4-3-10-3-15 0-3 0-6 4-7z"/>
      </g>
      <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    </svg>
    <h2 class="splash-logo">Ласкаво просимо!</h2>
    <p class="splash-title">Оберіть мову · Please select your preferred language</p>
    <div class="lang-buttons">
      <button class="lang-btn" onclick="selectLanguage('uk')">
        <svg class="flag-icon" viewBox="0 0 60 40" aria-hidden="true"><rect width="60" height="20" fill="#0057b7"/><rect y="20" width="60" height="20" fill="#ffd700"/></svg>
        Українська
      </button>
      <button class="lang-btn" onclick="selectLanguage('en')">
        <svg class="flag-icon" viewBox="0 0 60 40" aria-hidden="true">
          <rect width="60" height="40" fill="#012169"/>
          <path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/>
          <path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/>
          <path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="13"/>
          <path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="8"/>
        </svg>
        English
      </button>
    </div>
  </div>
</div>

<script>
  function selectLanguage(lang){
    document.getElementById('languageSplash').classList.add('hidden');
    document.documentElement.lang = lang;
  }

  function showSplash(){
    const s = document.getElementById('languageSplash');
    s.style.display = 'flex';
    requestAnimationFrame(() => s.classList.remove('hidden'));
  }

  document.getElementById('testTag').addEventListener('click', showSplash);
  // Заставка показується при кожному заході на сторінку (вибір не пропускає її наступного разу).
</script>
</body>
</html>
