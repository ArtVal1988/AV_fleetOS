<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AV Lab — тестова сторінка</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d26;--muted:#6b7280;--accent:#0a4174;--line:#e5e7eb;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.stripe{height:6px;background:repeating-linear-gradient(45deg,#f59e0b 0 10px,#1a1d26 10px 20px);}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);}
header img{height:32px}
header h1{font-size:16px;margin:0;font-weight:700}
header .tag{margin-left:auto;font-size:11px;font-weight:700;color:#92400e;background:#fef3c7;padding:3px 8px;border-radius:10px}
main{max-width:960px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.card h2{margin:0 0 8px;font-size:15px}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
#sandbox{margin-top:16px;min-height:240px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:16px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <img src="/logo.png" alt="AV" onerror="this.style.display='none'">
  <h1>AV Lab</h1>
  <span class="tag">🧪 ТЕСТОВИЙ САЙТ</span>
</header>
<main>
  <div class="card">
    <h2>Експериментальна сторінка</h2>
    <p>Окрема сторінка тестового сайту. Вона не пов'язана з основною програмою, не потребує входу й не торкається бази даних. На основному сайті її немає. <a href="/">← До програми</a></p>
  </div>
  <div id="sandbox">Тут буде наш експеримент</div>
</main>
</body>
</html>
